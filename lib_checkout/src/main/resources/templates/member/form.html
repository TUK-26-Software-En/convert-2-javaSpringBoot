<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Member</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/member.css}">
    <script defer th:src="@{/js/main.js}"></script>
    <script defer th:src="@{/js/member.js}"></script>
</head>
<body data-page="members">
<header class="page-header compact-header">
    <div>
        <p class="eyebrow">Member Management</p>
        <h1>회원 등록</h1>
    </div>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/books}">Books</a>
        <a th:href="@{/members}">Members</a>
        <a th:href="@{/loans}">Loans</a>
    </nav>
</header>

<main class="page-body narrow-body">
    <section class="panel form-panel">
        <p class="error-message" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <form th:action="@{/members}" th:object="${memberCreateRequest}" method="post" class="entity-form">
            <label>
                이름
                <input type="text" th:field="*{name}" data-focus>
                <span class="field-error" th:errors="*{name}"></span>
            </label>
            <label>
                이메일
                <input type="email" th:field="*{email}">
                <span class="field-error" th:errors="*{email}"></span>
            </label>
            <label>
                전화번호
                <input type="text" th:field="*{phoneNumber}">
                <span class="field-error" th:errors="*{phoneNumber}"></span>
            </label>
            <label>
                상태
                <select th:field="*{status}">
                    <option th:each="status : ${memberStatuses}" th:value="${status}" th:text="${status}"></option>
                </select>
                <span class="field-error" th:errors="*{status}"></span>
            </label>

            <div class="form-actions">
                <a class="button secondary-button" th:href="@{/members}">목록으로</a>
                <button type="submit" class="button primary-button">등록</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
