<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Management</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/member.css}">
    <script defer th:src="@{/js/main.js}"></script>
    <script defer th:src="@{/js/member.js}"></script>
</head>
<body data-page="members">
<header class="page-header compact-header">
    <div>
        <p class="eyebrow">Member Management</p>
        <h1>회원 관리</h1>
    </div>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/books}">Books</a>
        <a th:href="@{/members}">Members</a>
        <a th:href="@{/loans}">Loans</a>
    </nav>
</header>

<main class="page-body">
    <div class="toolbar">
        <a class="button primary-button" th:href="@{/members/new}">회원 등록</a>
    </div>

    <p class="flash-message" th:if="${message}" th:text="${message}"></p>

    <section class="panel">
        <table class="data-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>이름</th>
                <th>이메일</th>
                <th>전화번호</th>
                <th>상태</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(members)}">
                <td colspan="5">등록된 회원이 없습니다.</td>
            </tr>
            <tr th:each="member : ${members}">
                <td th:text="${member.id}">1</td>
                <td th:text="${member.name}">이름</td>
                <td th:text="${member.email}">email@example.com</td>
                <td th:text="${member.phoneNumber}">010-0000-0000</td>
                <td><span class="status-badge" th:text="${member.status}">ACTIVE</span></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
