<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Loan</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/loan.css}">
    <script defer th:src="@{/js/main.js}"></script>
    <script defer th:src="@{/js/loan.js}"></script>
</head>
<body data-page="loans">
<header class="page-header compact-header">
    <div>
        <p class="eyebrow">Loan Management</p>
        <h1>대출 등록</h1>
    </div>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/books}">Books</a>
        <a th:href="@{/members}">Members</a>
        <a th:href="@{/loans}">Loans</a>
    </nav>
</header>

<main class="page-body narrow-body">
    <section class="panel form-panel">
        <p class="error-message" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <form th:action="@{/loans}" th:object="${loanCreateRequest}" method="post" class="entity-form">
            <label>
                도서
                <select th:field="*{bookId}" data-focus>
                    <option value="">선택하세요</option>
                    <option th:each="book : ${availableBooks}"
                            th:value="${book.id}"
                            th:text="${book.title + ' / 남은 수량 ' + book.availableQuantity}"></option>
                </select>
                <span class="field-error" th:errors="*{bookId}"></span>
            </label>
            <label>
                회원
                <select th:field="*{memberId}">
                    <option value="">선택하세요</option>
                    <option th:each="member : ${activeMembers}"
                            th:value="${member.id}"
                            th:text="${member.name + ' / ' + member.email}"></option>
                </select>
                <span class="field-error" th:errors="*{memberId}"></span>
            </label>
            <label>
                반납 예정일
                <input type="date" th:field="*{dueDate}">
                <span class="field-error" th:errors="*{dueDate}"></span>
            </label>

            <div class="form-actions">
                <a class="button secondary-button" th:href="@{/loans}">목록으로</a>
                <button type="submit" class="button primary-button">대출 등록</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
